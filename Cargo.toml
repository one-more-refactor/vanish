[package]
name = "vanish"
version = "0.1.0-alpha"
edition = "2021"
rust-version = "1.80"
description = "Presence-based session lock: pull the anchor, walk away with the headset, or POST a webhook — the desktop locks itself."
license = "GPL-3.0-or-later"
repository = "https://github.com/one-more-refactor/vanish"
readme = "README.md"
keywords = ["lock", "presence", "buskill", "bluetooth", "wayland"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# One raw netlink socket for USB removals. libudev would be a running daemon
# and a C library between us and an event that must not be missed.
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "vanish"
path = "src/main.rs"
